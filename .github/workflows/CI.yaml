name: CI

on:
  push:
    branches:
      - main
      - 9.0.0
  pull_request:
    branches:
      - main
      - 9.0.0

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Setup Flutter
        uses: subosito/flutter-action@v1
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Configure example API key
        run: echo "const stadiaMapsApiKey = '';" > example/lib/api_key.dart

      - name: Check formatting
        run: dart format . --output none --set-exit-if-changed

      - name: Run Dart analyzer
        run: flutter analyze

      - name: Run tests
        run: flutter test -r expanded
